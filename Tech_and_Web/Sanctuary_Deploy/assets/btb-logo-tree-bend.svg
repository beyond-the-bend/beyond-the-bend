    <path class="sand-stroke" d="M70 280 C116 214, 174 214, 218 246 C250 270, 300 270, 334 220" fill="none" stroke-width="22" stroke-linecap="round"/>
    <path class="rose-stroke" d="M78 282 C124 226, 178 228, 218 256 C252 280, 302 274, 340 226" fill="none" stroke-width="5" stroke-linecap="round"/>

    <path d="M184 258 C186 220, 186 174, 182 128" fill="none" stroke="#4f6049" stroke-width="12" stroke-linecap="round"/>
    <path d="M184 178 C158 160, 132 152, 110 156" fill="none" stroke="#4f6049" stroke-width="9" stroke-linecap="round"/>
    <path d="M184 160 C214 138, 244 130, 274 136" fill="none" stroke="#4f6049" stroke-width="9" stroke-linecap="round"/>
    <path d="M184 136 C170 112, 152 98, 128 92" fill="none" stroke="#4f6049" stroke-width="7" stroke-linecap="round"/>
    <path d="M184 132 C210 100, 238 86, 270 86" fill="none" stroke="#4f6049" stroke-width="7" stroke-linecap="round"/>

    <ellipse class="sage-fill" cx="108" cy="154" rx="34" ry="20" transform="rotate(-16 108 154)" opacity="0.78"/>
    <ellipse class="sage-fill" cx="132" cy="96" rx="32" ry="19" transform="rotate(28 132 96)" opacity="0.82"/>
    <ellipse class="sage-fill" cx="222" cy="102" rx="42" ry="24" transform="rotate(-24 222 102)" opacity="0.86"/>
    <ellipse class="sage-fill" cx="276" cy="136" rx="36" ry="20" transform="rotate(17 276 136)" opacity="0.76"/>
    <ellipse class="sage-fill" cx="154" cy="150" rx="28" ry="17" transform="rotate(10 154 150)" opacity="0.72"/>
