<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Beyond the Bend tree logo</title>
  <desc id="desc">A simple Beyond the Bend logo with a tree beside a curved bend motif.</desc>
  <defs>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500&amp;family=Inter:wght@500;600&amp;display=swap");
      .ink { fill: #2f332d; }
      .muted { fill: #6b7065; }
      .sage-fill { fill: #6f8065; }
      .rose-stroke { stroke: #b98178; }
      .sand-stroke { stroke: #d8cfc3; }
      .text-main {
        font-family: "Literata", Georgia, serif;
        font-size: 86px;
        font-weight: 400;
        letter-spacing: -1.8px;
      }
      .text-small {
        font-family: "Inter", Arial, sans-serif;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 4.6px;
      }
    </style>
  </defs>

  <rect width="1200" height="520" fill="#fffaf2"/>

  <g transform="translate(104 68)">
