<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Apple Web App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Morning">
    
    <title>Laura Morning</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Lato:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage: #A8B5A2;
            --deep-sage: #6B8063;
            --darker-sage: #4d5f48;
            --rosewood: #B06568;
            --sand: #E6D5C7;
            --bg: #F9F7F5;
            --text: #3a3a3a;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            /* Prevent text selection */
            -webkit-user-select: none;
            user-select: none;
        }

        .container {
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 3rem;
            font-weight: 300;
            font-style: italic;
            color: var(--darker-sage);
            margin-bottom: 5px;
            line-height: 1.1;
        }

        p {
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.15em;
            color: #8a8a8a;
            margin-top: 15px;
            margin-bottom: 60px;
            text-transform: uppercase;
        }

        .play-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: var(--white);
            border: 1px solid rgba(168,181,162,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            /* Prevent tap highlight on mobile */
            -webkit-tap-highlight-color: transparent;
        }

        .play-btn:active {
            transform: scale(0.95);
            background: var(--sand);
        }

        .play-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--darker-sage);
            margin-left: 4px; /* Optical centering for play button */
        }
        
        .play-btn.playing svg {
            margin-left: 0; /* Clear optical margin when pause icon is shown */
        }

        .progress-container {
            margin-top: 50px;
            width: 100%;
            height: 3px;
            background: rgba(168,181,162,0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--darker-sage);
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            font-size: 0.75rem;
            color: #aaa;
            font-family: 'Lato', sans-serif;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Good morning,<br>Laura</h1>
        <p>A Declaration of Belonging</p>

        <div class="play-btn" id="playBtn" onclick="togglePlay()">
            <!-- Play Icon -->
            <svg id="playIcon" viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
            <!-- Pause Icon -->
            <svg id="pauseIcon" viewBox="0 0 24 24" style="display:none;">
                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div class="time-display">
            <span id="currentTime">0:00</span>
            <span id="duration">...</span>
        </div>

        <audio id="audioPlayer" src="media/laura-morning-affirmation.mp3" preload="metadata"></audio>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const playIcon = document.getElementById('playIcon');
        const pauseIcon = document.getElementById('pauseIcon');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationEl = document.getElementById('duration');

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        audio.addEventListener('loadedmetadata', () => {
            durationEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('timeupdate', () => {
            currentTimeEl.textContent = formatTime(audio.currentTime);
            if (audio.duration) {
                const percent = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = percent + '%';
            }
        });

        audio.addEventListener('ended', () => {
            playIcon.style.display = 'block';
            pauseIcon.style.display = 'none';
            playBtn.classList.remove('playing');
            progressBar.style.width = '0%';
            audio.currentTime = 0;
        });

        function togglePlay() {
            if (audio.paused) {
                audio.play();
                playIcon.style.display = 'none';
                pauseIcon.style.display = 'block';
                playBtn.classList.add('playing');
            } else {
                audio.pause();
                playIcon.style.display = 'block';
                pauseIcon.style.display = 'none';
                playBtn.classList.remove('playing');
            }
        }
    </script>
</body>
</html>
