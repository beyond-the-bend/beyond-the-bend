  <g transform="translate(400 162)">
    <text class="text-main ink" x="0" y="0" dominant-baseline="hanging">Beyond the Bend</text>
    <line x1="4" y1="122" x2="536" y2="122" stroke="#d8cfc3" stroke-width="1"/>
    <text class="text-small muted" x="4" y="158">COME HOME TO YOURSELF</text>
